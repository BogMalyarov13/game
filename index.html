<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выживание в лесу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #8ab8d4; font-family: Arial, sans-serif; }
        canvas { display: block; cursor: pointer; }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            color: #fff;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: rgba(255,255,255,0.7);
        }
        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.4);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
        }
        #stats-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #health {
            display: flex;
            gap: 2px;
            font-size: 18px;
        }
        #health .heart { color: #ff4757; }
        #health .lost { color: #555; }
        #hunger-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        #hunger-bar {
            width: 100px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #555;
        }
        #hunger-fill {
            height: 100%;
            width: 100%;
            background: #ffaa44;
            border-radius: 5px;
            transition: width 0.2s;
        }
        #inventory {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            margin-top: 3px;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 8px;
            pointer-events: none;
            flex-wrap: wrap;
        }
        #inventory .icon { font-size: 18px; }
        .inv-item { display: flex; align-items: center; gap: 4px; }
        #kill-count { font-size: 14px; }
        #hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        #hint.show { opacity: 1; }
        #controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.3);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            text-align: right;
        }
        #controls kbd {
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            margin: 0 2px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 30px 50px;
            border-radius: 16px;
            border: 2px solid #ff4757;
            text-align: center;
            display: none;
            z-index: 30;
            pointer-events: auto;
            color: #fff;
        }
        #game-over h1 {
            font-size: 48px;
            color: #ff4757;
            text-shadow: 0 0 30px #ff0000;
        }
        #game-over button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #f1c40f;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #game-over button:hover { background: #e6b800; transform: scale(1.05); }
        @media (max-width: 700px) {
            #controls { font-size: 11px; padding: 4px 8px; }
            #stats { font-size: 13px; padding: 4px 10px; }
            #hunger-bar { width: 70px; height: 8px; }
            #health { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="crosshair">✚</div>
        <div id="stats">
            <div id="stats-row">
                <span id="health"></span>
                <span id="kill-count">🦌 <span id="killCount">0</span></span>
                <span id="hunger-container">
                    <span>🍖</span>
                    <div id="hunger-bar"><div id="hunger-fill" style="width:100%"></div></div>
                    <span id="hunger-label">100%</span>
                </span>
            </div>
            <div id="inventory">
                <span class="inv-item"><span class="icon">🪵</span> <span id="woodCount">0</span></span>
                <span class="inv-item"><span class="icon">🔥</span> <span id="fireCount">0</span></span>
                <span class="inv-item"><span class="icon">🥩</span> <span id="meatCount">0</span></span>
                <span class="inv-item"><span class="icon">🍓</span> <span id="berryCount">0</span></span>
                <span style="font-size:12px; opacity:0.6;">F – есть мясо | E – стрельба/сбор</span>
            </div>
        </div>
        <div id="hint">Нажмите <kbd>E</kbd> чтобы собрать дрова/ягоды</div>
        <div id="controls">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> – ходьба &nbsp; <kbd>Пробел</kbd> – прыжок<br>
            <kbd>E</kbd> – стрельба/сбор &nbsp; <kbd>F</kbd> – съесть мясо &nbsp; <kbd>ЛКМ</kbd> – осмотр
        </div>
    </div>

    <div id="game-over">
        <h1>💀 Вы погибли</h1>
        <p>Голод или звери одолели вас...</p>
        <button id="restartBtn">↺ Начать заново</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ---------- СЦЕНА ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8ab8d4);
        scene.fog = new THREE.Fog(0x8ab8d4, 60, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(0, 1.6, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ---------- ОСВЕЩЕНИЕ ----------
        const ambient = new THREE.AmbientLight(0x8090b0, 0.7);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.5);
        sun.position.set(40, 50, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
        fill.position.set(-30, 20, -30);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffddbb, 0.3);
        rim.position.set(0, 10, -40);
        scene.add(rim);

        // ---------- ЗЕМЛЯ ----------
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x4a8a4a, roughness: 0.8 })
        );
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ---------- ТРАВА ----------
        const grassTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 8;
            canvas.height = 8;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a7a2a';
            ctx.fillRect(2, 0, 4, 8);
            ctx.fillStyle = '#3a8a3a';
            ctx.fillRect(0, 2, 8, 4);
            return new THREE.CanvasTexture(canvas);
        })();
        const grassMat = new THREE.PointsMaterial({
            color: 0x4a8a4a,
            map: grassTexture,
            size: 0.3,
            transparent: true,
            opacity: 0.8,
            depthWrite: false,
        });
        const grassGeo = new THREE.BufferGeometry();
        const grassCount = 6000;
        const positions = new Float32Array(grassCount * 3);
        for (let i = 0; i < grassCount; i++) {
            const angle = Math.random() * Math.PI*2;
            const radius = 5 + Math.random() * 90;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            if (Math.abs(x) < 22 && Math.abs(z) < 22) continue;
            positions[i*3] = x;
            positions[i*3+1] = 0.02;
            positions[i*3+2] = z;
        }
        grassGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const grass = new THREE.Points(grassGeo, grassMat);
        scene.add(grass);

        // ---------- ДЕРЕВЬЯ ----------
        const treeColliders = [];
        function createTree(x, z) {
            const g = new THREE.Group();
            const h = 1.8 + Math.random() * 3.5;
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.4, h, 6),
                new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.8 })
            );
            trunk.position.y = h/2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            g.add(trunk);
            const ch = 1.8 + Math.random() * 2.8;
            const cr = 0.8 + Math.random() * 2.0;
            const crown = new THREE.Mesh(
                new THREE.ConeGeometry(cr, ch, 7),
                new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.25 + Math.random()*0.1, 0.6, 0.35 + Math.random()*0.25), roughness: 0.6 })
            );
            crown.position.y = h + ch/2 - 0.3;
            crown.castShadow = true;
            crown.receiveShadow = true;
            g.add(crown);
            g.position.set(x, 0, z);
            scene.add(g);
            treeColliders.push({ x, z, radius: 0.8 });
            return g;
        }
        for (let i=0; i<280; i++) {
            const angle = Math.random() * Math.PI*2;
            const radius = 6 + Math.random() * 55;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            if (Math.abs(x) < 22 && Math.abs(z) < 22) continue;
            createTree(x, z);
        }

        // ---------- КУСТЫ ----------
        for (let i=0; i<70; i++) {
            const angle = Math.random() * Math.PI*2;
            const radius = 5 + Math.random() * 50;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            if (Math.abs(x) < 22 && Math.abs(z) < 22) continue;
            const bush = new THREE.Mesh(
                new THREE.SphereGeometry(0.3+Math.random()*0.6, 5),
                new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.3, 0.5, 0.25+Math.random()*0.15), roughness: 0.8 })
            );
            bush.position.set(x, 0.2, z);
            bush.castShadow = true;
            bush.receiveShadow = true;
            scene.add(bush);
        }

        // ---------- ПРУД ----------
        const pondRadius = 18;
        const water = new THREE.Mesh(
            new THREE.CircleGeometry(pondRadius, 48),
            new THREE.MeshStandardMaterial({
                color: 0x2a8aaa,
                transparent: true,
                opacity: 0.5,
                roughness: 0.1,
                metalness: 0.3,
                emissive: 0x1a4a6a,
                emissiveIntensity: 0.05,
                side: THREE.DoubleSide,
            })
        );
        water.rotation.x = -Math.PI/2;
        water.position.y = 0.05;
        water.receiveShadow = true;
        scene.add(water);
        for (let i=0; i<40; i++) {
            const angle = Math.random() * Math.PI*2;
            const r = Math.random() * (pondRadius - 2);
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const glitter = new THREE.Mesh(
                new THREE.CircleGeometry(0.2 + Math.random()*0.5, 6),
                new THREE.MeshBasicMaterial({ color: 0x88ddff, transparent: true, opacity: 0.1 + Math.random()*0.15 })
            );
            glitter.rotation.x = -Math.PI/2;
            glitter.position.set(x, 0.08, z);
            scene.add(glitter);
        }

        // ---------- РЫБКИ ----------
        const fishGroup = new THREE.Group();
        scene.add(fishGroup);
        const fishes = [];
        for (let i=0; i<12; i++) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.08, 0.3, 5),
                new THREE.MeshStandardMaterial({ color: 0xffaa44, roughness: 0.3 })
            );
            body.rotation.x = Math.PI/2;
            body.position.z = 0.05;
            body.castShadow = true;
            g.add(body);
            const tail = new THREE.Mesh(
                new THREE.ConeGeometry(0.06, 0.12, 4),
                new THREE.MeshStandardMaterial({ color: 0xff8844 })
            );
            tail.position.z = -0.2;
            tail.rotation.x = 0.2;
            g.add(tail);
            const eye = new THREE.Mesh(
                new THREE.SphereGeometry(0.02, 4),
                new THREE.MeshStandardMaterial({ color: 0x000000 })
            );
            eye.position.set(0.04, 0.03, 0.12);
            g.add(eye);
            const eye2 = eye.clone();
            eye2.position.set(-0.04, 0.03, 0.12);
            g.add(eye2);
            g.userData = { angle: Math.random()*Math.PI*2, speed: 0.3+Math.random()*0.5, radius: 0.5+Math.random()*2, phase: Math.random()*Math.PI*2 };
            const a = Math.random()*Math.PI*2;
            const r = Math.random()*(pondRadius-1);
            g.position.set(Math.cos(a)*r, -0.2+(Math.random()-0.5)*0.6, Math.sin(a)*r);
            g.rotation.y = Math.random()*Math.PI*2;
            fishGroup.add(g);
            fishes.push(g);
        }

        // ---------- ДОМ ----------
        const houseGroup = new THREE.Group();
        houseGroup.position.set(30, 0, 30);
        scene.add(houseGroup);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xd4b48c, roughness: 0.8 });
        const walls = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 5), wallMat);
        walls.position.y = 1.5;
        walls.castShadow = true;
        walls.receiveShadow = true;
        houseGroup.add(walls);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b3a3a, roughness: 0.7 });
        const roof = new THREE.Mesh(new THREE.ConeGeometry(3.8, 1.5, 4), roofMat);
        roof.position.y = 3.0 + 0.75;
        roof.rotation.y = Math.PI/4;
        roof.castShadow = true;
        roof.receiveShadow = true;
        houseGroup.add(roof);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x6a4a2a });
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.1), doorMat);
        door.position.set(0, 0.9, 2.51);
        door.castShadow = true;
        houseGroup.add(door);
        const handleMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6), handleMat);
        handle.position.set(0.3, 0.9, 2.56);
        houseGroup.add(handle);
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x224466, emissiveIntensity: 0.1 });
        const win1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.05), windowMat);
        win1.position.set(1.2, 1.8, 2.51);
        houseGroup.add(win1);
        const win2 = win1.clone();
        win2.position.set(-1.2, 1.8, 2.51);
        houseGroup.add(win2);
        const win3 = win1.clone();
        win3.position.set(2.51, 1.8, 1.2);
        win3.rotation.y = Math.PI/2;
        houseGroup.add(win3);
        const win4 = win1.clone();
        win4.position.set(-2.51, 1.8, 1.2);
        win4.rotation.y = Math.PI/2;
        houseGroup.add(win4);

        // ---------- АВТОМАТ ----------
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5, metalness: 0.8 });
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.6, 6), barrelMat);
        barrel.rotation.x = Math.PI/2;
        barrel.position.set(0.2, -0.1, -0.4);
        weaponGroup.add(barrel);
        const stockMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.9 });
        const stock = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.35), stockMat);
        stock.position.set(0.2, -0.1, -0.85);
        weaponGroup.add(stock);
        const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.3), barrelMat);
        handguard.position.set(0.2, 0.0, -0.5);
        weaponGroup.add(handguard);
        const magMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.12), magMat);
        mag.position.set(0.2, -0.22, -0.55);
        weaponGroup.add(mag);
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x4a2a1a });
        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.2, 6), gripMat);
        grip.position.set(0.2, -0.22, -0.65);
        grip.rotation.x = 0.3;
        weaponGroup.add(grip);
        const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.08, 6), barrelMat);
        muzzle.rotation.x = Math.PI/2;
        muzzle.position.set(0.2, -0.1, -0.12);
        weaponGroup.add(muzzle);
        const sight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.04, 0.02), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        sight.position.set(0.2, 0.06, -0.35);
        weaponGroup.add(sight);

        // Вспышка
        const flashMat = new THREE.SpriteMaterial({
            map: (() => {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                gradient.addColorStop(0, 'rgba(255,255,200,1)');
                gradient.addColorStop(0.3, 'rgba(255,200,100,0.8)');
                gradient.addColorStop(1, 'rgba(255,100,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 32, 32);
                return new THREE.CanvasTexture(canvas);
            })(),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const flash = new THREE.Sprite(flashMat);
        flash.position.set(0.2, -0.1, -0.1);
        flash.scale.set(0.3, 0.3, 1);
        flash.visible = false;
        weaponGroup.add(flash);

        // ---------- РЕСУРСЫ ----------
        // Дрова (куски дерева)
        const woodObjects = [];
        function spawnWood(pos) {
            const wood = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.1, 0.2, 4),
                new THREE.MeshStandardMaterial({ color: 0x6a4a2a, roughness: 0.9 })
            );
            wood.position.copy(pos);
            wood.position.y = 0.06;
            wood.rotation.set(Math.random(), Math.random(), Math.random());
            wood.castShadow = true;
            wood.receiveShadow = true;
            scene.add(wood);
            woodObjects.push(wood);
            return wood;
        }

        // Ягоды (красные кустики)
        const berryObjects = [];
        function spawnBerry(pos) {
            const g = new THREE.Group();
            const bush = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 4),
                new THREE.MeshStandardMaterial({ color: 0x2a7a2a })
            );
            bush.position.y = 0.08;
            bush.castShadow = true;
            g.add(bush);
            for (let i=0; i<3; i++) {
                const berry = new THREE.Mesh(
                    new THREE.SphereGeometry(0.04, 4),
                    new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x440000 })
                );
                const a = Math.random()*Math.PI*2;
                const r = 0.05 + Math.random()*0.1;
                berry.position.set(Math.cos(a)*r, 0.15 + Math.random()*0.04, Math.sin(a)*r);
                g.add(berry);
            }
            g.position.copy(pos);
            g.position.y = 0;
            scene.add(g);
            berryObjects.push(g);
            return g;
        }

        // Разброс ресурсов
        for (let i=0; i<30; i++) {
            const angle = Math.random()*Math.PI*2;
            const radius = 5 + Math.random()*45;
            const x = Math.cos(angle)*radius;
            const z = Math.sin(angle)*radius;
            if (Math.abs(x) < 22 && Math.abs(z) < 22) continue;
            if (Math.abs(x-30) < 5 && Math.abs(z-30) < 5) continue;
            spawnWood(new THREE.Vector3(x, 0, z));
        }
        for (let i=0; i<25; i++) {
            const angle = Math.random()*Math.PI*2;
            const radius = 5 + Math.random()*40;
            const x = Math.cos(angle)*radius;
            const z = Math.sin(angle)*radius;
            if (Math.abs(x) < 22 && Math.abs(z) < 22) continue;
            if (Math.abs(x-30) < 5 && Math.abs(z-30) < 5) continue;
            spawnBerry(new THREE.Vector3(x, 0, z));
        }

        // ---------- ЖИВОТНЫЕ ----------
        const animalGroup = new THREE.Group();
        scene.add(animalGroup);
        let aliveAnimals = [];
        let deadAnimals = [];
        const RESPAWN_TIME = 10;

        function createAnimal(type, x, z) {
            const g = new THREE.Group();
            let color1, color2, size, hp, speed, aggressive, hitRadius, attackDamage, meatDrop;
            switch(type) {
                case 'deer':
                    color1 = 0x8a6a4a; color2 = 0x6a4a2a; size = 0.5; hp = 3; speed = 0.5+Math.random()*0.5; aggressive = false; hitRadius = 0.8; attackDamage = 0; meatDrop = 2; break;
                case 'rabbit':

                default: color1 = 0x8a6a4a; color2 = 0x6a4a2a; size = 0.5; hp = 3; speed = 0.5; aggressive = false; hitRadius = 0.8; attackDamage = 0; meatDrop = 2;

            const matHead = new THREE.MeshStandardMaterial({ color: color1, roughness: 0.7 });
            const body = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 8), matBody);
            body.scale.set(1.2, 0.8, 0.8);

                for (let side = -1; side <= 1; side+=2) {
                    const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, size * 0.8, 4), earMat);
                    ear.position.set(side * size * 0.25, size * 1.6, 0);

                    ear.rotation.x = -0.2;

                }
            }
            if (type === 'deer') {
                const hornMat = new THREE.MeshStandardMaterial({ color: 0x6a4a2a });
                for (let side = -1; side <= 1; side+=2) {
                    const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, size * 0.8, 4), hornMat);
                    horn.position.set(side * size * 0.4, size * 1.8, 0);

                    horn.castShadow = true;
                    g.add(horn);

            tail.position.set(-size*1.2, size*0.6, 0);
            tail.rotation.x = 0.3;
            tail.rotation.z = 0.2;
            tail.castShadow = true;
            g.add(tail);
            const legGroup = new THREE.Group();
            for (let i = -1; i <= 1; i+=2) {

            hpBarGroup.position.set(0, size * 2.2, 0);
            const bg = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.08), new THREE.MeshBasicMaterial({ color: 0x333333 }));
            bg.position.z = -0.01;

            fill.position.x = 0;

                type, state: 'idle', timer: 0, speed, hp, maxHp: hp, meatDrop,

                aggressive, hitRadius, attackDamage, attackCooldown: 0,
                legGroup, walkTime: 0, meshes: []
            };
            g.traverse((child) => { if (child.isMesh) g.userData.meshes.push(child); });
            animalGroup.add(g);
            return g;
        }

        function getRandomSpawnPosition() {
            let x, z, valid;
            let attempts = 0;
            do {
                const angle = Math.random() * Math.PI*2;
                const radius = 8 + Math.random() * 70;
                x = Math.cos(angle) * radius;
                z = Math.sin(angle) * radius;
                valid = true;
                if (Math.abs(x) < 22 && Math.abs(z) < 22) valid = false;
                if (Math.abs(x-30) < 5 && Math.abs(z-30) < 5) valid = false;
                attempts++;
            } while (!valid && attempts < 20);
            return { x, z };
        }

            for (let type of ['deer','rabbit','wolf','bear']) {

        function playShotSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 256;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize) * 0.3;
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.1;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        }

        function createBloodSplat(position) {
            const bloodTexture = (() => {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(200,0,0,0.8)');
                gradient.addColorStop(0.3, 'rgba(150,0,0,0.6)');
                gradient.addColorStop(1, 'rgba(100,0,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            })();
            const sprite = new THREE.Sprite(
                new THREE.SpriteMaterial({ map: bloodTexture, transparent: true, depthWrite: false, blending: THREE.NormalBlending })
            );
            sprite.position.copy(position);
            sprite.position.y = 0.02;
            sprite.scale.set(0.8, 0.8, 1);
            scene.add(sprite);
            setTimeout(() => scene.remove(sprite), 5000);
        }

        function performShot() {
            if (shotCooldown > 0 || gameOver) return;
            shotCooldown = 0.25;
            playShotSound();
            flash.visible = true;
            setTimeout(() => { flash.visible = false; }, 80);
            weaponGroup.position.y += 0.03;
            setTimeout(() => { weaponGroup.position.y = 0; }, 100);

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const origin = camera.position.clone();
            let hitAnimal = null, minDist = Infinity;
            aliveAnimals.forEach(animal => {
                if (animal.userData.dead) return;
                const center = animal.position.clone();
                const radius = animal.userData.hitRadius || 0.8;
                const toCenter = center.clone().sub(origin);
                const proj = toCenter.dot(dir);
                if (proj < 0) return;
                const closestPoint = origin.clone().add(dir.clone().multiplyScalar(proj));
                const distToCenter = closestPoint.distanceTo(center);
                if (distToCenter < radius) {
                    const dist = origin.distanceTo(center);
                    if (dist < minDist) { minDist = dist; hitAnimal = animal; }
                }
            });
            if (hitAnimal) {
                const data = hitAnimal.userData;
                data.hp--;
                const fill = data.fill;
                const percent = data.hp / data.maxHp;
                fill.scale.x = Math.max(0, percent);
                fill.position.x = -0.28 * (1 - percent);
                createBloodSplat(hitAnimal.position);
                data.meshes.forEach(mesh => {
                    if (mesh.material) {
                        const orig = mesh.material.color.getHex();
                        mesh.material.color.setHex(0xff0000);
                        setTimeout(() => { mesh.material.color.setHex(orig); }, 150);
                    }
                });
                if (data.hp <= 0) {
                    data.dead = true;
                    data.meshes.forEach(mesh => { if (mesh.material) mesh.material.color.setHex(0x666666); });
                    hitAnimal.rotation.x = -Math.PI/2;
                    hitAnimal.position.y = 0.1;
                    if (data.hpBar) data.hpBar.visible = false;
                    killCount++;
                    killDisplay.textContent = killCount;
                    // Выпадение мяса
                    const meatAmount = data.meatDrop || 1;
                    spawnMeat(hitAnimal.position, meatAmount);
                    createBloodSplat(hitAnimal.position);
                    const idx = aliveAnimals.indexOf(hitAnimal);
                    if (idx !== -1) {
                        aliveAnimals.splice(idx, 1);
                        onAnimalDeath(hitAnimal);
                    }
                }
            }
        }

        // ---------- КОЛЛИЗИЯ ----------
        function applyCollision() {
            if (camera.position.y < 1.6) {
                camera.position.y = 1.6;
                velocityY = 0;
                isOnGround = true;
            }
            const pos = camera.position;
            for (const tree of treeColliders) {
                const dx = pos.x - tree.x, dz = pos.z - tree.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < tree.radius + 0.4 && dist > 0.001) {
                    const pushDir = new THREE.Vector3(dx, 0, dz).normalize();
                    const overlap = tree.radius + 0.4 - dist;
                    camera.position.x += pushDir.x * overlap;
                    camera.position.z += pushDir.z * overlap;
                }
            }
            const worldRadius = 80;
            const dist = Math.sqrt(pos.x*pos.x + pos.z*pos.z);
            if (dist > worldRadius) {
                const ratio = worldRadius / dist;
                camera.position.x *= ratio;
                camera.position.z *= ratio;
            }
        }

        // ---------- ФИЗИКА ----------

        // ---------- ЖИВОТНЫЕ (обновление) ----------
        function updateAnimals(delta) {
            aliveAnimals.forEach(animal => {
                if (animal.userData.dead) return;
                const data = animal.userData;
                data.timer += delta;
                if (data.timer > 2 + Math.random() * 3) {
                    data.timer = 0;
                    data.state = 'move';
                    data.angle = Math.random() * Math.PI*2;
                }
                let moving = false;
                if (data.state === 'move') {
                    const speed = data.speed * delta;
                    const x = animal.position.x + Math.cos(data.angle) * speed;
                    const z = animal.position.z + Math.sin(data.angle) * speed;
                    const dist = Math.sqrt(x*x + z*z);
                    if (dist < 80 && !(Math.abs(x) < 22 && Math.abs(z) < 22) && !(Math.abs(x-30) < 5 && Math.abs(z-30) < 5)) {
                        animal.position.x = x;
                        animal.position.z = z;
                        moving = true;
                    } else {
                        data.state = 'idle';
                        data.timer = 0;
                    }
                    animal.rotation.y = -data.angle + Math.PI/2;
                }
                const legs = data.legGroup.children;
                if (moving) {
                    data.walkTime += delta * 10;
                    const swing = Math.sin(data.walkTime) * 0.3;
                    legs.forEach((leg, idx) => {
                        leg.rotation.x = swing * (idx % 2 === 0 ? 1 : -1);
                    });
                } else {
                    legs.forEach(leg => { leg.rotation.x *= 0.9; });
                }
                if (data.hpBar && data.hpBar.visible) data.hpBar.lookAt(camera.position);

                if (data.aggressive) {
                    const distToPlayer = animal.position.distanceTo(camera.position);
                    if (distToPlayer < 8 && !data.dead) {
                        const dir = new THREE.Vector3().subVectors(camera.position, animal.position).normalize();
                        animal.position.add(dir.multiplyScalar(data.speed * delta * 1.5));
                        animal.rotation.y = Math.atan2(dir.x, dir.z);
                    }
                    if (distToPlayer < 1.8 && !data.dead && data.attackCooldown <= 0) {
                        takeDamage(data.attackDamage || 1);
                        data.attackCooldown = 2.0;
                        const dir = new THREE.Vector3().subVectors(camera.position, animal.position).normalize();
                        camera.position.add(dir.multiplyScalar(0.5));
                        animal.position.add(dir.clone().multiplyScalar(-0.5));
                    }
                    if (data.attackCooldown > 0) data.attackCooldown -= delta;
                }
                if (data.type === 'rabbit') {
                    const distToPlayer = animal.position.distanceTo(camera.position);
                    if (distToPlayer < 5) {
                        const dir = new THREE.Vector3().subVectors(animal.position, camera.position).normalize();
                        animal.position.add(dir.multiplyScalar(data.speed * delta * 2));
                        animal.rotation.y = Math.atan2(dir.x, dir.z);
                    }
                }
            });
        }

        renderer.domElement.addEventListener('click', (event) => {
            if (showStartScreen) {
                showStartScreen = false;
                startGame();
                return;
            }
            // Клик по объектам (сбор по клику)
            if (gameActive && !gameOver) {
                const rect = renderer.domElement.getBoundingClientRect();
                const mouse = new THREE.Vector2();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                // Проверяем клик по дровам и ягодам
                const woodIntersects = raycaster.intersectObjects(woodObjects);
                if (woodIntersects.length > 0) {
                    const w = woodIntersects[0].object;
                    const idx = woodObjects.indexOf(w);
                    if (idx !== -1) {
                        scene.remove(w);
                        woodObjects.splice(idx, 1);
                        woodCount++;
                        updateInventoryUI();
                        hint.textContent = 'Собрали дрова 🪵';
                        hint.classList.add('show');
                        setTimeout(() => hint.classList.remove('show'), 1000);
                        return;
                    }
                }
                const berryIntersects = raycaster.intersectObjects(berryObjects);
                if (berryIntersects.length > 0) {
                    const b = berryIntersects[0].object;
                    // Находим родительскую группу
                    let parent = b.parent;
                    while (parent && !berryObjects.includes(parent)) {
                        parent = parent.parent;
                    }
                    if (parent && berryObjects.includes(parent)) {
                        const idx = berryObjects.indexOf(parent);
                        if (idx !== -1) {
                            scene.remove(parent);
                            berryObjects.splice(idx, 1);
                            berryCount++;
                            updateInventoryUI();
                            hunger = Math.min(maxHunger, hunger + 10);
                            updateHungerUI();
                            hint.textContent = 'Собрали ягоды 🍓 (+10 голод)';
                            hint.classList.add('show');
                            setTimeout(() => hint.classList.remove('show'), 1000);
                            return;
                        }
                    }
                }
            }
        });

        // Вращение камеры (зажатая ЛКМ)
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isMouseDown = true;
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            }
        });
        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isMouseDown = false;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown || !gameActive || gameOver) return;
            const dx = e.clientX - prevMouse.x;
            const dy = e.clientY - prevMouse.y;
            prevMouse.x = e.clientX;
            prevMouse.y = e.clientY;
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= dx * 0.005;
            euler.x -= dy * 0.005;
            euler.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, euler.x));
            camera.quaternion.setFromEuler(euler);
        });

        restartBtn.addEventListener('click', () => {
            gameOverDiv.style.display = 'none';
            gameOver = false;
            gameActive = true;
            playerHP = maxHP;
            hunger = maxHunger;
            woodCount = 0;
            fireCount = 0;
            meatCount = 0;
            berryCount = 0;
            killCount = 0;
            killDisplay.textContent = '0';
            updateHealthUI();
            updateHungerUI();
            updateInventoryUI();
            // Удалить мясо со сцены
            scene.children.forEach(child => {
                if (child.isMesh && child.material && child.material.color.getHex() === 0xcc3333) {
                    scene.remove(child);
                }
            });
            // Сброс животных
            aliveAnimals.forEach(a => animalGroup.remove(a));
            aliveAnimals = [];
            deadAnimals = [];
            spawnAnimals();
            camera.position.set(0, 1.6, 20);
            camera.quaternion.identity();
        });

        function startGame() {
            if (gameActive) return;
            gameActive = true;
            gameOver = false;
            camera.position.set(0, 1.6, 20);
            camera.quaternion.identity();
            hint.textContent = 'Собирай ресурсы (E или клик), F – есть мясо, C – костёр';
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 4000);
            playNatureSounds();
            updateHungerUI();
            updateInventoryUI();
            console.log('🌲 Выживание в лесу – начато!');
        }

        function playNatureSounds() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 4096;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * 0.05;
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.08;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
            setInterval(() => {
                if (Math.random() > 0.7) return;
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 1000 + Math.random() * 2000;
                gain2.gain.value = 0.02;
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 50 + Math.random() * 100);
            }, 3000);
        }

        // ---------- ГЛАВНЫЙ ЦИКЛ ----------
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            if (gameActive && !gameOver) {
                // Движение
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0; right.normalize();
                let moveX = 0, moveZ = 0;
                if (keys['KeyW']) moveZ -= 1;
                if (keys['KeyS']) moveZ += 1;
                if (keys['KeyA']) moveX -= 1;
                if (keys['KeyD']) moveX += 1;
                const moveVec = new THREE.Vector3();
                if (moveX !== 0 || moveZ !== 0) {
                    moveVec.addScaledVector(forward, -moveZ);
                    moveVec.addScaledVector(right, moveX);
                    moveVec.normalize().multiplyScalar(walkSpeed * delta);
                }
                camera.position.x += moveVec.x;
                camera.position.z += moveVec.z;
                // Прыжок
                if (keys['Space'] && isOnGround) {
                    velocityY = jumpSpeed;
                    isOnGround = false;
                }
                velocityY += gravity * delta;
                camera.position.y += velocityY * delta;
                applyCollision();
                // Обновление
                updateAnimals(delta);
                // Голод
                hunger -= 0.4 * delta;
                if (hunger < 0) hunger = 0;
                updateHungerUI();
                if (hunger === 0) {
                    hungerDamageTimer += delta;
                    if (hungerDamageTimer >= 3) {
                        hungerDamageTimer = 0;
                        takeDamage(1);
                    }
                } else {
                    hungerDamageTimer = 0;
                }
                if (shotCooldown > 0) shotCooldown -= delta;
                // Подсказка у двери (декоративно)
                const doorPos = new THREE.Vector3(30, 0.9, 32.5);
                if (camera.position.distanceTo(doorPos) < 2.0) {
                    hint.textContent = 'Дом 🏠 (пока только декорация)';
                    hint.classList.add('show');
                } else if (!hint.textContent.includes('Собирай')) {
                    hint.classList.remove('show');
                }
                // Анимация автомата
                const isMoving = (moveX !== 0 || moveZ !== 0) && isOnGround;
                if (isMoving) {
                    walkTime += delta * 10;
                    weaponGroup.position.y = Math.sin(walkTime) * 0.01;
                    weaponGroup.position.x = Math.sin(walkTime * 0.8) * 0.005;
                } else {
                    weaponGroup.position.y += (0 - weaponGroup.position.y) * 0.08;
                    weaponGroup.position.x += (0 - weaponGroup.position.x) * 0.08;
                }
            }
            // Рыбки
            fishes.forEach(fish => {
                const data = fish.userData;
                data.angle += delta * data.speed;
                const r = data.radius;
                const x = Math.cos(data.angle) * r;
                const z = Math.sin(data.angle) * r;
                const y = -0.2 + Math.sin(data.angle * 0.8 + data.phase) * 0.3;
                fish.position.set(x, y, z);
                fish.rotation.y = -data.angle + Math.PI/2;
                fish.rotation.z = Math.sin(data.angle * 2 + data.phase) * 0.1;
            });
            renderer.render(scene, camera);
            if (showStartScreen) drawStartScreen();
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌲 Выживание в лесу – клик по экрану для старта!');
    </script>
</body>
</html>
